project:
  name: main-dinov2
  family: nanopath
  recipe_id: dinov2-vits14-reg-kde
  output_dir: /data/$USER/nanopath/main/default
  wandb_dir: /data/$USER/nanopath/wandb

data:
  # dataset_dir holds the Arrow shards (shard-NNNNN.arrpw) that train.py reads.
  # `prepare.py … download=True` populates it from the medarc/nanopath training mirror.
  dataset_dir: /data/nanopath_arrow
  split_seed: 7777
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.2, 1.0]
  local_crop_scale: [0.03, 0.25]
  color_jitter: 0.45
  color_jitter_saturation: 0.4
  hed_jitter: 0.12
  tissue_thresh: 0.5 # training compares cached tissue fractions; rejected tiles are resampled

model:
  type: dinov2_vits14_reg

train:
  seed: 7777
  bf16: true
  activation_checkpointing: false
  compile: true
  fused_adamw: true
  batch_size: 128
  gpu_augment: true
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000 # tile presentations; global/local crops still count as one sample
  max_train_flops: 1000000000000000000 # 1.0e18, the leaderboard FLOP budget
  log_every: 20
  save_every: 1000
  # Validation pass every `eval_every` steps over `val_batches` held-out batches
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 8
  global_size: 224
  local_size: 98
  resume: null # optional explicit checkpoint path; null means always start fresh and wipe output_dir

dino:
  lr: 1.0e-4
  lr_min: 1.0e-6
  adam_beta2: 0.99
  warmup_fraction: 0.03
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0

probe:
  enabled: true
  model_weights: ema
  count: 1 # 4 means probing at 25%, 50%, 75%, and 100% of the sample cap. 1 means probing just at the end.
  datasets:
    - bach
    - bracs
    - break_his
    - crc
    - esca
    - mhist
    - pcam
    - spider_breast
    - spider_colorectal
    - spider_skin
    - spider_thorax
    - wilds
  segmentation_datasets:
    - pannuke
    - segpath_epithelial
    - segpath_lymphocytes
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bach: /content/drive/MyDrive/nanopath/probes/bach
    bracs: /content/drive/MyDrive/nanopath/probes/bracs
    break_his: /content/drive/MyDrive/nanopath/probes/break_his
    crc: /content/drive/MyDrive/nanopath/probes/crc
    esca: /content/drive/MyDrive/nanopath/probes/esca
    mhist: /content/drive/MyDrive/nanopath/probes/mhist
    pcam: /content/drive/MyDrive/nanopath/probes/pcam
    spider_breast: /content/drive/MyDrive/nanopath/probes/spider_breast
    spider_colorectal: /content/drive/MyDrive/nanopath/probes/spider_colorectal
    spider_skin: /content/drive/MyDrive/nanopath/probes/spider_skin
    spider_thorax: /content/drive/MyDrive/nanopath/probes/spider_thorax
    wilds: /content/drive/MyDrive/nanopath/probes/wilds
    pannuke: /content/drive/MyDrive/nanopath/probes/pannuke
    segpath_epithelial: /content/drive/MyDrive/nanopath/probes/segpath_epithelial
    segpath_lymphocytes: /content/drive/MyDrive/nanopath/probes/segpath_lymphocytes
    cptac_pda_os: /content/drive/MyDrive/nanopath/probes/cptac_pda_os
    leopard_bcr: /content/drive/MyDrive/nanopath/probes/leopard_bcr
    pathorob: /content/drive/MyDrive/nanopath/probes/pathorob
    surgen: /content/drive/MyDrive/nanopath/probes/surgen
    ucla_lung: /content/drive/MyDrive/nanopath/probes/ucla_lung

# Interpretability rig, see interpret/README.md
interpret:
  seed: 42 # the one seed: samplers and all random number generators
  checkpoint_path: /content/drive/MyDrive/nanopath/interpret/checkpoints/dummy_checkpoint.pt
  model_weights: model_ema # checkpoint key: model_ema (teacher) or model (student)
  output_dir: /content/drive/MyDrive/nanopath/interpret
  dataset: pathorob_camelyon
  datasets:
    pathorob_camelyon:
      stratification_dimension: biological_class # sample field the sampler stratifies over
  extract:
    num_samples: 10000 # stratified subsample of the dataset
    batch_size: 128
    num_workers: 2 # image decoding only
    layer_stride: 4 # every n-th layer, counted from the last
  methods: [layer_inversion]
  cka:
    max_samples: 10000 # random subset of the extracted examples (at most this many); the tables are n x n (0.1 GB each at 5,000, 0.4 GB at 10,000, 2.5 GB at 25,000)
  linear_probe:
    targets: [biological_class, medical_center, brightness, tissue_brightness, tissue_fraction, hematoxylin, eosin] 
    lrs: [1.0e-3, 1.0e-4, 1.0e-5] # grid, like probe.py
    weight_decays: [0.0, 1.0e-4, 1.0e-3] # grid, like probe.py
    epochs: 50 
    batch_size: 512
    num_workers: 8 # DataLoader worker processes that fetch the batches of the probe in parallel (CPU cores minus 1)
    leakage_group: slide_id  # metadata field whose values are never split across train and validation 
    folds: 4 
  layer_inversion:
    decoders: [linear, transformer]
    transformer: # the blocks of the transformer decoder, with the encoder's block settings
      depth: 4
      head_dim: 64
      mlp_ratio: 4.0
      drop_path: 0.0
    lrs: [1.0e-3, 3.0e-4] # grid
    weight_decays: [0.0] # a weight decay would also pull the output bias (which we rely on for compensating the omitted standardization of the target images)
    epochs: 20
    batch_size: 128
    num_workers: 8
    stratify: biological_class # metadata field the folds are stratified on
    leakage_group: slide_id # metadata field whose values are never split across train and validation
    folds: 4
    num_collage_rows: 8 # rows of the collage
