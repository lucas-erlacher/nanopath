# systems values are tuned to work on Colab L4 instance

project:
  name: main-dinov2
  family: nanopath
  recipe_id: dinov2-vits14-reg-kde
  wandb_entity: lucaserlacher_research
  wandb_project: nanopath
  labless_autosubmit: false
  output_dir: ""  # overwritten by colab cell
  wandb_dir: /content/wandb

data:
  # dataset_dir holds the parquet shards (shard-NNNNN.parquet) that train.py reads.
  # `prepare.py … download=True` populates it from the medarc/nanopath HF mirror.
  dataset_dir: /content/drive/MyDrive/nanopath/nanopath_parquet
  split_seed: 7777
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.2, 1.0]
  local_crop_scale: [0.03, 0.25]
  color_jitter: 0.45
  color_jitter_saturation: 0.4
  hed_jitter: 0.12
  tissue_thresh: 0.5 # training rejects tiles unless this fraction of pixels has RGB saturation > 0.07

prune:
  enabled: false
  embedding_model: kaiko_vits16  # [dinov2_vits14_reg, kaiko_vits16]
  embedding_mean: [0.5, 0.5, 0.5]
  embedding_std: [0.5, 0.5, 0.5]
  embedding_model_batchsize: 2048
  embeddings_path: /content/drive/MyDrive/nanopath/tile_embeddings/
  scores_path: /content/drive/MyDrive/nanopath/tile_scores/hierarchical_tile_scores.parquet
  hierarchical_cluster_counts: [35000, 350, 62, 1]
  num_clusters: 1024
  sampling_intensity: 0.0  # 0 is uniform sampling, 1 is fully score-weighted
  cut_score: null  # null keeps every tile; otherwise scores above this value are removed

online_cluster_weighting:
  enabled: false
  update_every_steps: 1000
  ema_decay: 0.95

model:
  type: dinov2_vits14_reg

train:
  seed: 7777
  bf16: true
  activation_checkpointing: false
  batch_size: 32
  num_workers: 32
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000 # tile presentations; global/local crops still count as one sample
  max_train_flops: 1000000000000000000 # 1.0e18, the leaderboard FLOP budget
  log_every: 20
  save_every: 1000
  # Validation pass every `eval_every` steps over `val_batches` held-out batches
  eval_every: 200
  val_batches: 16
  stop_step: null # optional optimizer step; null runs to the declared flops cap
  global_views: 2
  local_views: 8
  global_size: 224
  local_size: 98
  resume: null # optional explicit checkpoint path; null means always start fresh and wipe output_dir

dino:
  lr: 1.0e-4
  lr_min: 1.0e-6
  adam_beta2: 0.99
  warmup_fraction: 0.03
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0

probe:
  enabled: true
  model_weights: ema
  count: 1 # probe n times during training (1 = only at the end)
  datasets:
    - bach
    - bracs
    - break_his
    - crc
    - esca
    - mhist
    - pcam
    - spider_breast
    - spider_colorectal
    - spider_skin
    - spider_thorax
    - wilds
  segmentation_datasets:
    - pannuke
    - segpath_epithelial
    - segpath_lymphocytes
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bach: /content/drive/MyDrive/nanopath/probes/bach
    bracs: /content/drive/MyDrive/nanopath/probes/bracs
    break_his: /content/drive/MyDrive/nanopath/probes/break_his
    crc: /content/drive/MyDrive/nanopath/probes/crc
    cptac_pda_os: /content/drive/MyDrive/nanopath/probes/cptac_pda_os
    esca: /content/drive/MyDrive/nanopath/probes/esca
    leopard_bcr: /content/drive/MyDrive/nanopath/probes/leopard_bcr
    mhist: /content/drive/MyDrive/nanopath/probes/mhist
    pcam: /content/drive/MyDrive/nanopath/probes/pcam
    pannuke: /content/drive/MyDrive/nanopath/probes/pannuke
    pathorob: /content/drive/MyDrive/nanopath/probes/pathorob
    segpath_epithelial: /content/drive/MyDrive/nanopath/probes/segpath_epithelial
    segpath_lymphocytes: /content/drive/MyDrive/nanopath/probes/segpath_lymphocytes
    spider_breast: /content/drive/MyDrive/nanopath/probes/spider_breast
    spider_colorectal: /content/drive/MyDrive/nanopath/probes/spider_colorectal
    spider_skin: /content/drive/MyDrive/nanopath/probes/spider_skin
    spider_thorax: /content/drive/MyDrive/nanopath/probes/spider_thorax
    surgen: /content/drive/MyDrive/nanopath/probes/surgen
    ucla_lung: /content/drive/MyDrive/nanopath/probes/ucla_lung
    wilds: /content/drive/MyDrive/nanopath/probes/wilds
